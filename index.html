<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROAMING — Mission Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Muli:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>

<body>

<header class="header">
  <div class="header__inner">
    <div class="brand">
      <div class="brand__title">ROAMING — Mission Control</div>
    </div>

    <nav class="nav">
      <a class="nav__link is-active" href="index.html">Accueil</a>
      <a class="nav__link" href="module1.html">Module 1</a>
    </nav>

    <button class="btn btn--primary" onclick="goToModule(1)">
      Démarrer
    </button>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Outiller les conseillers à la mobilité internationale</h1>
    <p>Déclencher • Sécuriser • Valoriser les parcours mobilité</p>

    <div class="stats">
      <div class="stat">
        <div id="xp">0</div>
        <small>XP</small>
      </div>
      <div class="stat">
        <div id="modules">0</div>
        <small>Modules complétés</small>
      </div>
    </div>

    <div class="progress">
      <div class="progress-bar">
        <div id="progressFill"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn--accent" onclick="goToModule(1)">
        Commencer Module 1
      </button>
      <button class="btn btn--ghost" onclick="resetProgress()">
        Réinitialiser
      </button>
    </div>
  </section>

</main>

<footer class="footer">
  © 2026 ROAMING — Mission Locale
</footer>

<script src="main.js"></script>

</body>
</html>
