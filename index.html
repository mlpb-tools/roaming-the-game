/* ROAMING – ajustement d'affichage sur ordinateur (n'affecte pas le mobile) */

  /* En-tête de page plus compact : pastille module + étiquette sur une même ligne */
  .rv63 { padding-top: 20px; }

  .rv63 .ro-v55-detailbody img.hero { max-height: 60vh; width: auto; max-width: 100%; display: block; margin-left: auto !important; margin-right: auto !important; }
